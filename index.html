<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>분풀이 방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe6ea;--surface:#f4f7f8;--ink:#1b2a3a;--muted:#5b6b7a;--hot:#e8334a;--tape:#ffc933;--line:#b9c5cd;
  --on-hot:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18212b;--surface:#222d39;--ink:#eef3f6;--muted:#9fb0bd;--hot:#ff5468;--tape:#ffd24d;--line:#364554;}}
:root[data-theme="dark"]{--bg:#18212b;--surface:#222d39;--ink:#eef3f6;--muted:#9fb0bd;--hot:#ff5468;--tape:#ffd24d;--line:#364554;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:clamp(34px,9vw,56px);line-height:1.1;margin:8px 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px}
.tape{height:14px;margin:0 -16px 16px;background:repeating-linear-gradient(-45deg,var(--tape) 0 18px,var(--ink) 18px 36px)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:12px 8px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font:700 15px "Noto Sans KR",sans-serif;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--hot);color:var(--on-hot);border-color:var(--hot)}
button:focus-visible,textarea:focus-visible,input:focus-visible,.bag:focus-visible,.bub:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.panel{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:18px}
.panel[hidden]{display:none}
label{display:block;font-weight:700;margin-bottom:6px}
input,textarea{width:100%;font:400 16px "Noto Sans KR",sans-serif;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:150px;resize:vertical}
.act{display:inline-block;margin-top:12px;padding:12px 20px;border:0;border-radius:10px;background:var(--hot);color:var(--on-hot);font:700 16px "Noto Sans KR",sans-serif;cursor:pointer}
.act.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* sandbag */
.arena{position:relative;height:360px;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;margin-top:12px;user-select:none;-webkit-user-select:none}
.chain{position:absolute;top:0;left:50%;width:4px;height:50px;margin-left:-2px;background:var(--muted)}
.bag{position:absolute;top:48px;left:50%;margin-left:-70px;width:140px;height:270px;border-radius:30px 30px 40px 40px;background:var(--hot);border:3px solid var(--ink);cursor:pointer;transform-origin:50% -48px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.bag span{font-family:"Black Han Sans",sans-serif;font-size:30px;color:var(--on-hot);text-align:center;padding:0 8px;word-break:keep-all;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.bag::before,.bag::after{content:"";position:absolute;left:-3px;right:-3px;height:14px;background:var(--tape);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.bag::before{top:48px}.bag::after{bottom:48px}
/* ===== 샌드백 타격감 v2 ===== */
#fxC{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:4}
.bag{will-change:transform}
.bagHeat{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;z-index:1;background:radial-gradient(circle at 50% 42%,rgba(255,90,60,.72),rgba(160,24,26,.42) 56%,rgba(90,6,6,.22));mix-blend-mode:multiply}
.bag span{position:relative;z-index:3}
.bag.has-photo #bagImg{z-index:0}
.bag.ko{filter:grayscale(.6) brightness(.72);transition:filter .45s ease-out}
.hud{position:absolute;left:8px;top:6px;z-index:9;pointer-events:none;opacity:0;transform:translateY(-6px);transition:opacity .16s,transform .16s}
.hud.on{opacity:1;transform:none}
.cmb{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:36px;line-height:1;color:var(--hot);-webkit-text-stroke:2px var(--ink);display:flex;align-items:baseline;gap:4px;transform-origin:0 60%}
.cmb b{font:700 15px "Noto Sans KR",sans-serif;-webkit-text-stroke:0;color:var(--ink);letter-spacing:.04em}
.heatbar{width:92px;height:8px;margin-top:5px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:rgba(255,255,255,.55)}
.heatbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc933,#ff6a1f 55%,#e8334a)}
.arena.fever::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 64px 10px rgba(232,51,74,.45);animation:fev .46s ease-in-out infinite alternate}
@keyframes fev{to{box-shadow:inset 0 0 92px 22px rgba(232,51,74,.72)}}
.pow{position:absolute;font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;line-height:1;white-space:nowrap;pointer-events:none;z-index:8;will-change:transform,opacity}
.pop{position:absolute;pointer-events:none;font-family:"Black Han Sans",sans-serif;font-size:28px;color:var(--tape);-webkit-text-stroke:1.5px var(--ink);animation:rise .7s ease-out forwards}
@keyframes rise{to{transform:translateY(-70px) scale(1.3);opacity:0}}
.hp{height:16px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--bg)}
.hp i{display:block;height:100%;width:100%;background:var(--hot);transition:width .15s}
.stat{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:14px}
/* shredder */
.stage{position:relative;height:200px;overflow:hidden;margin-top:12px;border:2px dashed var(--line);border-radius:10px;display:none}
.strip{position:absolute;top:0;bottom:0;overflow:hidden;background:var(--bg)}
.strip div{position:absolute;top:0;left:0;padding:10px 12px;font-size:16px;white-space:pre-wrap;word-break:break-word}
.fall{animation:fall 1.1s ease-in forwards}
@keyframes fall{to{transform:translateY(260px) rotate(var(--r));opacity:0}}
.msg{margin:12px 0 0;font-weight:700;min-height:1.6em}
/* bubble wrap */
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:12px}
.bub{aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--tape) 13% 100%);cursor:pointer;padding:0;transition:transform .08s}
.bub:active{transform:scale(.88)}
.bub.done{background:var(--bg);border-style:dashed;border-color:var(--line);transform:scale(.8)}
#p1{transition:background .3s;background:color-mix(in srgb,var(--hot) calc(var(--anger,0)*30%),var(--surface))}
.gauge{height:14px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--bg);margin-top:10px}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--tape),var(--hot));transition:width .12s}
.gtxt{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:4px}
.rage{animation:trem .12s infinite}
@keyframes trem{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}100%{transform:translate(0,0)}}
.stage.emo{height:auto;min-height:200px;padding:12px;font-size:24px;line-height:1.9;word-break:break-all}
.ch{display:inline-block;transition:transform .5s ease-out,opacity .5s ease-out}
.ch.boom{transform:translate(var(--dx),var(--dy)) scale(2.4) rotate(var(--rr));opacity:0}
.weap{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.weap button{flex:1 1 30%;padding:10px 6px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font:700 14px "Noto Sans KR",sans-serif;border-radius:10px;cursor:pointer}
.weap button[aria-pressed="true"]{background:var(--tape);color:#1b2a3a}
.hole{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#1b2a3a;box-shadow:0 0 0 3px rgba(255,255,255,.55);pointer-events:none}
.bag{-webkit-touch-callout:none}
[hidden]{display:none!important}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.snd{flex:none;margin-top:12px;padding:8px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink);font:700 13px "Noto Sans KR",sans-serif;cursor:pointer}
#bagImg{width:118px;height:118px;border-radius:50%;object-fit:cover;border:3px solid var(--ink);background:var(--bg);pointer-events:none}
.target{position:relative;overflow:hidden;margin-top:12px;min-height:200px;padding:14px;border:2px solid var(--ink);border-radius:10px;background:var(--bg);font-size:18px;line-height:1.7;white-space:pre-wrap;word-break:break-word;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:none;transition:filter .1s}
.target.shake{animation:trem .2s}
.target.ash{transition:opacity 1s,filter 1s,transform 1s;opacity:0;filter:blur(6px) brightness(.3);transform:translateY(-20px)}
.target.crumble{transition:opacity .9s,transform .9s;opacity:0;transform:translateY(120px) rotate(6deg) scale(.9)}
.ball{position:absolute;font-size:26px;pointer-events:none;transition:transform .28s ease-in;z-index:3}
.blast{position:absolute;pointer-events:none;font-size:64px;margin:-32px 0 0 -32px;animation:rise .6s ease-out forwards;z-index:3}
.burnmark{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#1b2a3a 0 35%,rgba(27,42,58,.45) 60%,transparent 72%)}
.pt{position:absolute;pointer-events:none;z-index:4;opacity:1;transition:transform var(--d,.6s) ease-out,opacity var(--d,.6s) ease-in}
.tracer{position:absolute;width:3px;margin-left:-1px;transform-origin:0 0;background:linear-gradient(to bottom,transparent,#ffe27a,#fff);pointer-events:none;z-index:4;opacity:1;transition:opacity .15s}
.tflash{position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(circle at var(--fx) var(--fy),rgba(255,240,170,.95),rgba(255,200,80,.35) 25%,transparent 55%);animation:tfl .16s ease-out forwards}
@keyframes tfl{to{opacity:0}}
.arena.big{height:430px}
.bruise{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:multiply;background:radial-gradient(circle,rgba(110,30,140,.6),rgba(200,60,60,.3) 55%,transparent 72%)}
.bag.has-photo{width:240px;height:340px;margin-left:-120px;overflow:hidden}
.bag.has-photo::before,.bag.has-photo::after{display:none}
.bag.has-photo #bagImg{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0;background:transparent;object-fit:cover}
.bolt{position:absolute;left:0;top:0;pointer-events:none;z-index:4;filter:drop-shadow(0 0 6px #ffe14d);animation:tfl .26s ease-out forwards}
.frost,.splat{position:absolute;border-radius:50%;pointer-events:none}
/* ===== 대포 FX: 포구 화염 · 고속 포탄 · 초대형 폭발 ===== */
body{overflow-x:hidden}
.fxroot{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:90;overflow:hidden;contain:layout paint}
.fxroot i{position:absolute;display:block;font-style:normal}
.cn{left:0;top:0;will-change:transform;z-index:2}
.cn .cnb{left:0;top:-11px;width:84px;height:22px;border-radius:11px 4px 4px 11px;background:linear-gradient(180deg,#9aacbd 0%,#4a5f72 42%,#131c25 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.6),0 8px 18px rgba(0,0,0,.4);transform-origin:2px 50%}
.cn .cnb::after{content:"";position:absolute;right:-8px;top:-7px;width:14px;height:36px;border-radius:4px;background:linear-gradient(180deg,#a6b7c8,#33424f 55%,#0f1720);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.cn .cnb::before{content:"";position:absolute;left:14px;top:-4px;width:12px;height:30px;border-radius:3px;background:linear-gradient(180deg,#a6b7c8,#33424f)}
.cn .cnw{left:20px;top:-16px;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#a6b7c8,#33424f 66%,#0b1219);border:3px solid #0b1219;box-shadow:0 5px 12px rgba(0,0,0,.35)}
.cn .cnw::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#0b1219}
.mf{border-radius:50%;background:radial-gradient(circle,#fff 0 13%,#fff3b0 24%,#ffc93d 40%,#ff7a14 58%,rgba(255,70,10,0) 76%);box-shadow:0 0 70px 24px rgba(255,150,40,.55);will-change:transform,opacity}
.mfc{transform-origin:0 50%;background:linear-gradient(90deg,rgba(255,255,235,.98),rgba(255,224,110,.95) 28%,rgba(255,140,36,.7) 62%,rgba(255,80,20,0) 100%);clip-path:polygon(0 50%,100% 0,100% 100%);will-change:transform,opacity}
.shell{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe07a 50%,#ff7a1a);box-shadow:0 0 14px #ffb02e,0 0 32px rgba(255,130,30,.9);will-change:transform}
.trail{border-radius:50%;background:radial-gradient(circle,#fff 0 28%,rgba(255,200,80,.78) 52%,rgba(255,140,40,0) 74%);will-change:transform,opacity}
.shock{border-radius:50%;border-style:solid;border-color:rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(220,80,20,.45),0 0 26px rgba(255,140,40,.75),inset 0 0 26px rgba(255,150,50,.45);will-change:transform,opacity}
.shock.hot{border-color:rgba(255,186,72,.95);box-shadow:0 0 30px rgba(255,120,20,.9),inset 0 0 30px rgba(255,150,50,.6)}
.fire{border-radius:50%;background:radial-gradient(circle,#fff8d0 0 4%,#ffd24d 11%,#ff9a1e 26%,#ef5310 46%,#a82708 63%,rgba(120,25,0,0) 88%);box-shadow:0 0 46px rgba(255,110,10,.55);will-change:transform,opacity}
.core{border-radius:50%;background:radial-gradient(circle,#fff 0 34%,#fff6c0 54%,rgba(255,220,120,0) 76%);box-shadow:0 0 36px 8px rgba(255,225,150,.8);will-change:transform,opacity}
.burst{border-radius:50%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,252,225,.98) 0 3deg,rgba(255,214,90,.7) 3deg 5.5deg,rgba(255,140,30,0) 5.5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 0 40%,rgba(0,0,0,.6) 60%,transparent 82%);mask-image:radial-gradient(circle,#000 0 40%,rgba(0,0,0,.6) 60%,transparent 82%);will-change:transform,opacity}
.scorch{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 50% 50%,#0d1620 0 26%,rgba(46,32,22,.88) 36%,rgba(96,64,38,.45) 50%,rgba(50,34,22,0) 64%),radial-gradient(circle at 32% 64%,rgba(35,24,16,.55),transparent 22%),radial-gradient(circle at 68% 36%,rgba(35,24,16,.5),transparent 20%);animation:scorfade 3.6s ease-out forwards}
@keyframes scorfade{0%{opacity:1}65%{opacity:.8}100%{opacity:0}}
.spark{border-radius:2px;will-change:transform,opacity}
.shard{background:#f8fbfd;border:1px solid #7d8c99;border-radius:1px;box-shadow:0 1px 3px rgba(20,30,40,.25);will-change:transform,opacity}
.ltr{font-family:"Black Han Sans","Noto Sans KR",sans-serif;color:#0f1c28;text-shadow:0 1px 0 #fff,0 2px 6px rgba(0,0,0,.35);white-space:pre;will-change:transform,opacity}
.smk{border-radius:50%;background:radial-gradient(circle,rgba(132,140,148,.42),rgba(160,168,176,.26) 52%,rgba(180,188,196,0) 76%);will-change:transform,opacity}
.fxflash{left:0;top:0;width:100%;height:100%;will-change:opacity}
.wrap.quake{animation:quake .55s cubic-bezier(.36,.07,.19,.97) both;will-change:transform}
@keyframes quake{0%{transform:translate(0,0) rotate(0)}8%{transform:translate(-10px,6px) rotate(-.6deg)}17%{transform:translate(9px,-7px) rotate(.5deg)}27%{transform:translate(-8px,5px) rotate(-.35deg)}38%{transform:translate(7px,-4px)}50%{transform:translate(-5px,4px)}63%{transform:translate(4px,-3px)}76%{transform:translate(-3px,2px)}88%{transform:translate(2px,-1px)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.pop,.fall{animation-duration:.01s}.rage{animation:none}.ch{transition-duration:.01s}.wrap.quake{animation:none}.scorch{animation-duration:1.2s}.arena.fever::after{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="tape" aria-hidden="true"></div>
  <div class="top"><h1>분풀이 방</h1><button type="button" class="snd" id="snd" aria-pressed="true">🔊 소리 켜짐</button></div>
  <p class="sub">여기서 한 말은 어디에도 저장되지 않아요. 마음껏 풀고 가세요.</p>

  <div class="tabs" role="tablist">
    <button role="tab" id="t0" aria-selected="true" aria-controls="p0">샌드백</button>
    <button role="tab" id="t1" aria-selected="false" aria-controls="p1">쓰고 파쇄</button>
    <button role="tab" id="t2" aria-selected="false" aria-controls="p2">뽁뽁이</button>
  </div>

  <section class="panel" id="p0" role="tabpanel" aria-labelledby="t0">
    <label for="who">때리고 싶은 사람</label>
    <input id="who" value="김 부장" maxlength="10">
    <div class="row">
      <button type="button" class="act alt" id="pickPhoto">📷 사진으로 바꾸기</button>
      <button type="button" class="act alt" id="noPhoto" hidden>이름으로 되돌리기</button>
    </div>
    <input type="file" id="photo" accept="image/*" hidden>
    <p class="sub" style="margin:8px 0 0;font-size:14px">사진은 이 기기 안에서만 쓰이고 어디에도 전송되거나 저장되지 않아요.</p>
    <div class="arena" id="arena">
      <div class="chain"></div>
      <div class="bag" id="bag" tabindex="0" role="button" aria-label="샌드백 치기"><span id="bagName">김 부장</span><img id="bagImg" alt="" hidden><i class="bagHeat" id="bagHeat" aria-hidden="true"></i></div>
      <canvas id="fxC" aria-hidden="true"></canvas>
      <div class="hud" id="hud" aria-hidden="true"><div class="cmb" id="cmb"><span id="cmbN">0</span><b>COMBO</b></div><div class="heatbar"><i id="heatBar"></i></div></div>
    </div>
    <div class="hp" aria-hidden="true"><i id="hpBar"></i></div>
    <div class="stat"><span>타격 <b id="hits">0</b>회</span><span id="hpTxt">체력 100</span></div>
    <button class="act alt" id="reset0">다시 세우기</button>
  </section>

  <section class="panel" id="p1" role="tabpanel" aria-labelledby="t1" hidden>
    <label for="rant">하고 싶은 말을 전부 쓰세요</label>
    <textarea id="rant" placeholder="욕이든 하소연이든 다 괜찮아요. 세게, 빠르게 쓸수록 화면이 달아올라요."></textarea>
    <div class="gauge" aria-hidden="true"><i id="gauge"></i></div>
    <div class="gtxt"><span>분노 게이지</span><span id="gLevel" aria-live="polite">잔잔함</span></div>
    <div class="stage" id="stage"></div>
    <div class="target" id="target" hidden></div>
    <div class="row">
      <button class="act" id="boom">이모지로 터뜨리기</button>
      <button class="act alt" id="shred">파쇄하기</button>
      <button class="act alt" id="clear">새로 쓰기</button>
    </div>
    <div class="gtxt" style="margin-top:14px"><span>무기로 부수기</span></div>
    <div class="weap" id="wrow" role="group" aria-label="무기로 부수기">
      <button type="button" data-w="gun" aria-pressed="false">🔫 총</button>
      <button type="button" data-w="flame" aria-pressed="false">🔥 화염방사기</button>
      <button type="button" data-w="cannon" aria-pressed="false">💣 대포</button>
      <button type="button" data-w="bolt" aria-pressed="false">⚡ 번개</button>
      <button type="button" data-w="ice" aria-pressed="false">🧊 얼음</button>
      <button type="button" data-w="dish" aria-pressed="false">🍽️ 그릇 던지기</button>
    </div>
    <div class="row">
    </div>
    <p class="msg" id="msg"></p>
  </section>

  <section class="panel" id="p2" role="tabpanel" aria-labelledby="t2" hidden>
    <div class="stat"><span>터뜨린 개수 <b id="popped">0</b> / 48</span></div>
    <div class="grid" id="grid"></div>
    <button class="act alt" id="refill">다시 채우기</button>
  </section>
</div>
<div id="fx" class="fxroot" aria-hidden="true"></div>

<script>
(function(){
  var AC=window.AudioContext||window.webkitAudioContext,ctx=null;
  var soundOn=true;function audio(){if(!soundOn)return null;try{if(!ctx&&AC)ctx=new AC();if(ctx&&ctx.state==="suspended")ctx.resume();}catch(e){}return ctx;}
  function thump(){var c=audio();if(!c)return;var o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(160,c.currentTime);o.frequency.exponentialRampToValueAtTime(45,c.currentTime+.15);g.gain.setValueAtTime(.7,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.2);}
  function snap(){var c=audio();if(!c)return;var n=c.sampleRate*.05,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);var s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=.5;s.connect(g);g.connect(c.destination);s.start();}

  /* tabs */
  var tabs=[].slice.call(document.querySelectorAll('[role=tab]'));
  tabs.forEach(function(t,i){t.addEventListener("click",function(){
    tabs.forEach(function(x,j){x.setAttribute("aria-selected",i===j);document.getElementById("p"+j).hidden=i!==j;});
  });});

  /* ===== 샌드백: 타격감 v2 (진자 물리 · 히트스톱 · 충격파 · 콤보 피버) ===== */
  var bag=document.getElementById("bag"),arena=document.getElementById("arena"),
      who=document.getElementById("who"),bagName=document.getElementById("bagName"),
      hpBar=document.getElementById("hpBar"),hpTxt=document.getElementById("hpTxt"),hitsEl=document.getElementById("hits"),
      hudEl=document.getElementById("hud"),cmbEl=document.getElementById("cmb"),cmbN=document.getElementById("cmbN"),
      heatBar=document.getElementById("heatBar"),bagHeat=document.getElementById("bagHeat"),
      fxc=document.getElementById("fxC"),fx2=fxc.getContext("2d");
  var hp=100,hits=0,combo=0,heat=0,lastHitT=0,ko=false;
  var PUNCH_W=["퍽!","쾅!","억!","윽!","빡!","으악!","팍!","퍽퍽!"],CRIT_W=["POW!","BAM!","WHAM!","BOOM!"];
  who.addEventListener("input",function(){bagName.textContent=who.value.trim()||"그 사람";});

  /* --- 캔버스 오버레이(스파크·충격파·스파이크) --- */
  var DPR=Math.min(2,window.devicePixelRatio||1),CW=0,CH=0;
  function sizeFx(){
    var r=arena.getBoundingClientRect();
    if(r.width<2||r.height<2)return;
    CW=r.width;CH=r.height;
    fxc.width=Math.max(1,Math.round(CW*DPR));fxc.height=Math.max(1,Math.round(CH*DPR));
    fx2.setTransform(DPR,0,0,DPR,0,0);
  }
  sizeFx();
  window.addEventListener("resize",sizeFx);
  window.addEventListener("orientationchange",function(){setTimeout(sizeFx,260);});

  /* --- 진자 반동 + 스쿼시·스트레치 --- */
  var bagP={a:0,av:0,sx:1,sy:1,vx:0,vy:0};
  function drawBag(){
    bag.style.transform="rotate("+(bagP.a*57.29578).toFixed(2)+"deg) scale("+bagP.sx.toFixed(3)+","+bagP.sy.toFixed(3)+")";
  }
  function bagSettled(){
    return Math.abs(bagP.a)<.0006&&Math.abs(bagP.av)<.004&&Math.abs(bagP.sx-1)<.0015&&Math.abs(bagP.sy-1)<.0015&&Math.abs(bagP.vx)<.004&&Math.abs(bagP.vy)<.004;
  }
  function physStep(dt){
    var n=Math.max(1,Math.ceil(dt/.0084)),h=dt/n,i;
    for(i=0;i<n;i++){
      bagP.av+=(-140*bagP.a-5.6*bagP.av)*h;bagP.a+=bagP.av*h;
      bagP.vx+=(-520*(bagP.sx-1)-17*bagP.vx)*h;bagP.sx+=bagP.vx*h;
      bagP.vy+=(-520*(bagP.sy-1)-17*bagP.vy)*h;bagP.sy+=bagP.vy*h;
    }
    if(bagP.a<-.52){bagP.a=-.52;if(bagP.av<0)bagP.av*=.4;}
    else if(bagP.a>.52){bagP.a=.52;if(bagP.av>0)bagP.av*=.4;}
    if(bagP.sx<.62)bagP.sx=.62;else if(bagP.sx>1.42)bagP.sx=1.42;
    if(bagP.sy<.64)bagP.sy=.64;else if(bagP.sy>1.52)bagP.sy=1.52;
    drawBag();
  }

  /* --- 파티클 --- */
  var PT=[],raf=0,lastT=0,hitstop=0;
  function add(p){if(PT.length>240)PT.shift();PT.push(p);return p;}
  function ring(x,y,r0,r1,w,dur,c){add({t:"rg",x:x,y:y,r0:r0,r1:r1,w:w,l:dur,dur:dur,c:c});}
  function spark(x,y,dx,dy,s,c,dur){add({t:"sp",x:x,y:y,vx:dx,vy:dy,s:s,c:c,l:dur,dur:dur});}
  function partStep(dt){
    fx2.clearRect(0,0,CW,CH);
    for(var i=PT.length-1;i>=0;i--){
      var p=PT[i];
      p.l-=dt;
      if(p.l<=0){PT.splice(i,1);continue;}
      var k=1-p.l/p.dur;
      if(k<0)k=0;
      if(p.t==="sp"){
        p.vy+=1150*dt;p.vx*=Math.max(0,1-1.6*dt);p.x+=p.vx*dt;p.y+=p.vy*dt;
        var al=Math.max(0,1-k*k);
        fx2.globalAlpha=al;fx2.strokeStyle=p.c;fx2.lineWidth=Math.max(1,p.s*.9);fx2.lineCap="round";
        fx2.beginPath();fx2.moveTo(p.x,p.y);
        fx2.lineTo(p.x-p.vx*.022,p.y-p.vy*.022);fx2.stroke();
        if(p.s>4.5&&k<.5){fx2.globalAlpha=al*.9;fx2.fillStyle="#fff";fx2.fillRect(p.x-p.s*.3,p.y-p.s*.3,p.s*.6,p.s*.6);}
      }else if(p.t==="db"){
        p.vy+=1500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
        fx2.globalAlpha=Math.max(0,1-k*k);fx2.save();fx2.translate(p.x,p.y);fx2.rotate(p.rot);
        fx2.fillStyle=p.c;fx2.fillRect(-p.w*.5,-p.h*.5,p.w,p.h);fx2.restore();
      }else if(p.t==="rg"){
        var rr=p.r0+(p.r1-p.r0)*(1-Math.pow(1-k,2.2));
        fx2.globalAlpha=Math.max(0,(1-k)*(1-k));
        fx2.strokeStyle=p.c;fx2.lineWidth=Math.max(.6,p.w*(1-k*.85));
        fx2.beginPath();fx2.arc(p.x,p.y,rr,0,6.28319);fx2.stroke();
      }else if(p.t==="fl"){
        var fr=p.r*(.55+k*1.5),gr=fx2.createRadialGradient(p.x,p.y,0,p.x,p.y,fr);
        gr.addColorStop(0,"rgba(255,255,255,"+(1-k)+")");
        gr.addColorStop(.3,"rgba(255,244,190,"+((1-k)*.7)+")");
        gr.addColorStop(.62,"rgba(255,170,70,"+((1-k)*.22)+")");
        gr.addColorStop(1,"rgba(255,90,20,0)");
        fx2.globalAlpha=1;fx2.fillStyle=gr;
        fx2.beginPath();fx2.arc(p.x,p.y,fr,0,6.28319);fx2.fill();
      }else if(p.t==="sk"){
        var sc=p.r*(.45+.75*(1-Math.pow(1-k,3))),n2=p.rads.length;
        fx2.save();fx2.translate(p.x,p.y);fx2.rotate(p.rot+k*.4);
        fx2.globalAlpha=Math.max(0,1-Math.pow(k,2.6));
        fx2.beginPath();
        for(var j=0;j<n2;j++){
          var an=3.14159*j/n2,rad=sc*p.rads[j]*1.11;
          var xx=Math.cos(an)*rad,yy=Math.sin(an)*rad;
          if(j)fx2.lineTo(xx,yy);else fx2.moveTo(xx,yy);
        }
        fx2.closePath();fx2.fillStyle=p.edge;fx2.fill();
        fx2.beginPath();
        for(var j2=0;j2<n2;j2++){
          var an2=3.14159*j2/n2,rad2=sc*p.rads[j2];
          var xx2=Math.cos(an2)*rad2,yy2=Math.sin(an2)*rad2;
          if(j2)fx2.lineTo(xx2,yy2);else fx2.moveTo(xx2,yy2);
        }
        fx2.closePath();fx2.fillStyle=p.c;fx2.fill();fx2.restore();
      }
    }
    fx2.globalAlpha=1;
  }
  function kick(){if(!raf){lastT=0;raf=requestAnimationFrame(loop);}}
  function loop(ts){
    raf=0;
    if(hitstop&&ts<hitstop){raf=requestAnimationFrame(loop);return;}
    var dt=lastT?Math.min(.05,(ts-lastT)/1000):.016;
    lastT=ts;
    physStep(dt);partStep(dt);
    if(PT.length||!bagSettled())raf=requestAnimationFrame(loop);else lastT=0;
  }

  /* --- 화면 흔들림 --- */
  function shakeWrap(p){
    var amp=5+15*p,rot=(Math.random()<.5?-1:1)*(.4+.9*p),kf=[],N=7,i;
    for(i=0;i<=N;i++){
      var f=1-i/N;
      kf.push({transform:"translate("+((Math.random()*2-1)*amp*f).toFixed(2)+"px,"+((Math.random()*2-1)*amp*f).toFixed(2)+"px) rotate("+((Math.random()*2-1)*rot*f).toFixed(2)+"deg)"});
    }
    kf.push({transform:"translate(0,0) rotate(0)"});
    try{wrapEl.animate(kf,{duration:Math.round(150+180*p),easing:"ease-out"});}catch(e){}
  }
  function shakeArena(p){
    try{
      arena.animate([
        {transform:"translate(0,0)"},
        {transform:"translate("+(p*4).toFixed(1)+"px,"+(-p*3.2).toFixed(1)+"px)"},
        {transform:"translate("+(-p*3).toFixed(1)+"px,"+(p*2.2).toFixed(1)+"px)"},
        {transform:"translate("+(p*1.4).toFixed(1)+"px,"+(-p*1).toFixed(1)+"px)"},
        {transform:"translate(0,0)"}
      ],{duration:Math.round(120+130*p),easing:"ease-out"});
    }catch(e){}
  }

  /* --- 만화풍 타격 텍스트 --- */
  function powText(txt,x,y,size,col,rot,big){
    var d=document.createElement("div");
    d.className="pow";d.textContent=txt;
    d.style.left=Math.max(size*.5,Math.min(Math.max(size*.5,CW-size*.5),x))+"px";
    d.style.top=Math.max(size*.7,y)+"px";
    d.style.fontSize=size+"px";
    d.style.color=col;
    var ow=Math.max(1.5,Math.round(size*.05*10)/10);
    d.style.setProperty("-webkit-text-stroke",ow+"px #16232f");
    d.style.setProperty("paint-order","stroke fill");
    d.style.textShadow="0 "+Math.round(size*.06)+"px 0 rgba(0,0,0,.32),0 0 18px rgba(255,190,60,.6)";
    var r="rotate("+rot+"deg)";
    d.style.transform="translate(-50%,-50%) "+r+" scale(.4)";
    arena.appendChild(d);
    var done=function(){if(d.parentNode)d.parentNode.removeChild(d);};
    var kf=[
      {transform:"translate(-50%,-50%) "+r+" scale(.35)",opacity:0,offset:0},
      {transform:"translate(-50%,-50%) "+r+" scale(1.3)",opacity:1,offset:.14},
      {transform:"translate(-50%,-50%) "+r+" scale(.97)",opacity:1,offset:.55},
      {transform:"translate(-50%,-66%) "+r+" scale(.92)",opacity:0,offset:1}
    ];
    if(d.animate){
      try{var an=d.animate(kf,{duration:760,easing:"cubic-bezier(.2,.9,.3,1)",fill:"forwards"});an.onfinish=done;}catch(e){setTimeout(done,760);}
    }else setTimeout(done,760);
  }

  /* --- 타격 자국 --- */
  function addBruise(x,y){
    var w=bag.offsetWidth,h=bag.offsetHeight,ox=w/2,oy=-48;
    var dx=x-bag.offsetLeft-ox,dy=y-bag.offsetTop-oy;
    var ca=Math.cos(bagP.a),sa=Math.sin(bagP.a);
    var lx=ox+(dx*ca+dy*sa)/bagP.sx,ly=oy+(-dx*sa+dy*ca)/bagP.sy;
    if(lx<10||lx>w-10||ly<10||ly>h-10)return;
    var m=document.createElement("i"),sz=40+Math.random()*26;
    m.className="bruise";
    m.style.cssText="width:"+sz+"px;height:"+sz+"px;margin:"+(-sz/2)+"px 0 0 "+(-sz/2)+"px;left:"+lx.toFixed(1)+"px;top:"+ly.toFixed(1)+"px";
    bag.appendChild(m);
    var hs=bag.querySelectorAll(".bruise");
    if(hs.length>26)hs[0].remove();
  }

  /* --- 사운드: 저음 thud + 크랙 + 체인 짤랑 (연타 시 리미팅) --- */
  var pbus=null,pvo=0;
  function pAudio(){
    var c=audio();if(!c)return null;
    if(!pbus){
      try{
        var k=c.createDynamicsCompressor();
        k.threshold.value=-20;k.knee.value=24;k.ratio.value=11;k.attack.value=.002;k.release.value=.15;
        var g=c.createGain();g.gain.value=.72;
        k.connect(g);g.connect(c.destination);pbus=k;
      }catch(e){pbus=c.destination;}
    }
    return c;
  }
  function pnz(c,dur,pw,type,freq,vol,at,q){
    var n=Math.max(1,Math.floor(c.sampleRate*dur)),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0),i;
    for(i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,pw);
    var s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),t=(at==null?c.currentTime:at);
    s.buffer=b;f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;
    g.gain.setValueAtTime(Math.max(.0004,vol),t);
    g.gain.exponentialRampToValueAtTime(.0006,t+dur);
    s.connect(f);f.connect(g);g.connect(pbus);
    s.start(t);s.stop(t+dur+.02);
  }
  function punchSnd(p,crit,cmb){
    var c=pAudio();if(!c)return;
    var t=c.currentTime,p2=Math.max(0,Math.min(1.4,p)),
        rate=.94+Math.random()*.14,duck=pvo>7?Math.max(.4,7/pvo):1;
    pvo++;setTimeout(function(){if(pvo>0)pvo--;},300);
    var o=c.createOscillator(),g=c.createGain();
    o.type="sine";o.frequency.setValueAtTime((165+55*p2)*rate,t);
    o.frequency.exponentialRampToValueAtTime(44,t+.13+.1*p2);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime((.42+.5*p2)*duck,t+.006);
    g.gain.exponentialRampToValueAtTime(.0007,t+.2+.16*p2);
    o.connect(g);g.connect(pbus);o.start(t);o.stop(t+.4+p2*.2);
    pnz(c,.14+.1*p2,1.5,"lowpass",(300+120*p2)*rate,(.26+.24*p2)*duck,t);
    pnz(c,.055,2.2,"bandpass",(1050+400*p2)*rate,(.34+.28*p2)*duck,t+.002,1.7);
    pnz(c,.03,2.6,"highpass",2600*rate,.2*duck,t+.004);
    if(p2>.3||Math.random()<.5){
      var base=2350+Math.random()*800,pan=null;
      if(c.createStereoPanner){try{pan=c.createStereoPanner();pan.pan.value=Math.random()*1.6-.8;pan.connect(pbus);}catch(e2){pan=null;}}
      [1,1.36,1.79,2.31].forEach(function(m,j){
        var co=c.createOscillator(),cg=c.createGain(),st=t+.008+j*.014;
        co.type="triangle";co.frequency.value=base*m*(1+(Math.random()*.03-.015));
        cg.gain.setValueAtTime(.0001,st);
        cg.gain.exponentialRampToValueAtTime((.055+.03*p2)*duck,st+.004);
        cg.gain.exponentialRampToValueAtTime(.0006,st+.14+Math.random()*.1);
        co.connect(cg);cg.connect(pan||pbus);
        co.start(st);co.stop(st+.3);
      });
    }
    if(crit){
      var so=c.createOscillator(),sg=c.createGain();
      so.type="sine";so.frequency.setValueAtTime(96,t);so.frequency.exponentialRampToValueAtTime(26,t+.42);
      sg.gain.setValueAtTime(.0001,t);sg.gain.exponentialRampToValueAtTime(.55*duck,t+.01);
      sg.gain.exponentialRampToValueAtTime(.0006,t+.46);
      so.connect(sg);sg.connect(pbus);so.start(t);so.stop(t+.5);
      pnz(c,.5,1.4,"lowpass",260,.4*duck,t+.01);
      pnz(c,.14,2,"highpass",3400,.18*duck,t+.02);
    }
  }
  function bang(){var c=audio();if(!c)return;var n=c.sampleRate*.12,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);var s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=.6;s.connect(g);g.connect(c.destination);s.start();}
  function buzz(p,crit){
    try{if(navigator.vibrate)navigator.vibrate(crit?[14,22,30]:Math.round(6+9*Math.max(0,p)));}catch(e){}
  }

  /* --- 임팩트 한 방 --- */
  function star(x,y,r,n,crit){
    var rads=[],i;
    for(i=0;i<n*2;i++)rads.push(i%2?(.40+Math.random()*.14):(.92+Math.random()*.28));
    add({t:"sk",x:x,y:y,r:r,rads:rads,rot:Math.random()*6.283,l:.34,dur:.34,
         c:crit?"#fff3b0":"#ffffff",edge:"#16232f"});
  }
  function impact(x,y,p,crit,fromL){
    var i,a,sp,n;
    star(x,y,(34+48*p)*(crit?1.2:1),crit?7:6,crit);
    ring(x,y,12,44+70*p,4+3*p,.3+.1*p,"#ffffff");
    ring(x,y,7,70+90*p,2,.42+.1*p,crit?"#ffd24d":"#ffab2e");
    add({t:"fl",x:x,y:y,r:34+38*p,l:.2,dur:.2});
    n=Math.round((12+26*p)*(crit?1.6:1));
    for(i=0;i<n;i++){
      a=Math.random()*6.283;sp=(110+Math.random()*420)*(.55+p*.95);
      spark(x,y,Math.cos(a)*sp,Math.sin(a)*sp*.82,2.5+Math.random()*4.5,
        Math.random()<.3?"#ffffff":(Math.random()<.5?"#ffd400":"#ff5f14"),.3+Math.random()*.4);
    }
    n=Math.round(4+10*p);
    for(i=0;i<n;i++){
      a=Math.random()*6.283;sp=(80+Math.random()*220)*(.5+p);
      add({t:"db",x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-90,
           w:2+Math.random()*4,h:1.5+Math.random()*2.5,rot:Math.random()*6.283,vr:(Math.random()*2-1)*14,
           c:Math.random()<.55?"#e8334a":"#8c1020",l:.5+Math.random()*.35,dur:.5+Math.random()*.35});
    }
    var word=crit?CRIT_W[(Math.random()*CRIT_W.length)|0]:PUNCH_W[(Math.random()*PUNCH_W.length)|0];
    powText(word,x,y-(crit?6:4),Math.round(crit?56+10*p:38+14*p),crit?"#ffffff":"#e8334a",(Math.random()*22-11)|0,crit);
    addBruise(x,y);
  }

  /* --- 콤보·열기 HUD --- */
  function updCombo(pop){
    if(combo>=2){
      hudEl.classList.add("on");cmbN.textContent=combo;
      if(pop&&cmbEl.animate){try{cmbEl.animate([{transform:"scale(1.55)"},{transform:"scale(1)"}],{duration:190,easing:"ease-out"});}catch(e){}}
    }else hudEl.classList.remove("on");
    arena.classList.toggle("fever",combo>=8);
  }
  function updHeat(){
    heatBar.style.width=(heat*100).toFixed(0)+"%";
    bagHeat.style.opacity=(heat*.82).toFixed(2);
    bag.style.boxShadow=heat>.02?"0 0 "+Math.round(8+34*heat)+"px rgba(255,80,60,"+(.12+.58*heat).toFixed(2)+")":"";
  }

  /* --- KO --- */
  function knockout(x,y,fromL){
    ko=true;
    hitstop=performance.now()+150;
    heat=1;updHeat();
    arena.classList.remove("fever");
    hudEl.classList.remove("on");
    bag.classList.add("ko");
    bagP.av+=(fromL?-1:1)*6.5;
    add({t:"rg",x:x,y:y,r0:20,r1:Math.max(CW,CH)*1.15,w:10,l:.9,dur:.9,c:"#ffffff"});
    add({t:"rg",x:x,y:y,r0:12,r1:Math.max(CW,CH)*.85,w:5,l:.8,dur:.8,c:"#ffb02e"});
    add({t:"sk",x:x,y:y,r:118,rads:(function(){var q=[],k2;for(k2=0;k2<16;k2++)q.push(k2%2?.42:(.95+Math.random()*.3));return q;})(),rot:Math.random()*6.283,l:.55,dur:.55,c:"#fff3b0",edge:"#16232f"});
    for(var i=0;i<40;i++){
      var a=Math.random()*6.283,sp=120+Math.random()*420;
      spark(x,y,Math.cos(a)*sp,Math.sin(a)*sp*.85,2.5+Math.random()*5,Math.random()<.4?"#ffe14d":"#ff6a1f",.5+Math.random()*.6);
    }
    powText("KO!",CW/2,CH*.34,84,"#ffe14d",-6,true);
    shakeWrap(1.55);shakeArena(1.5);
    punchSnd(1.3,true,combo);
    buzz(1.4,true);
    drawBag();partStep(0);
    kick();
  }

  /* --- 타격 --- */
  function hit(x,y){
    if(ko)return;
    var now=performance.now(),aw=arena.clientWidth;
    combo=(now-lastHitT<820)?combo+1:1;
    lastHitT=now;
    var crit=Math.random()<.16,
        p=Math.min(1,.4+Math.min(9,combo-1)*.05+(crit?.28:0)+Math.random()*.1),
        fromL=x<aw/2,
        dmg=Math.round(3+Math.random()*4+Math.min(9,combo-1)*.55+(crit?8:0));

  function cannon(x,y){

    }

    for(q=0;q<nT;q++){

  function pt(o){

  function gunFx(x,y){
    var cw=tgt.clientWidth,ch=tgt.clientHeight,dx=x-cw/2,dy=y-ch,L=Math.sqrt(dx*dx+dy*dy);

    for(var i=0;i<7;i++)pt({x:x,y:y,dx:Math.random()*90-45,dy:Math.random()*90-45,s:5+Math.random()*6,bg:"#fff",d:.5,r:Math.random()*360,css:"box-shadow:0 0 0 1px rgba(27,42,58,.4);border-radius:2px"});
    for(var j=0;j<2;j++)pt({x:cw/2,y:ch-8,dx:Math.random()*120-60,dy:-(30+Math.random()*50),s:6,bg:"#ffc933",d:.6,r:360,css:"border-radius:2px"});

  var fTick=0;
  function flameFx(x,y){
    var cw=tgt.clientWidth,ch=tgt.clientHeight,dx=x-cw/2,dy=y-ch,burn=1-tHp/100;fTick++;
    for(var i=0;i<4;i++){var k=Math.random();pt({x:cw/2+(Math.random()*20-10),y:ch-10,dx:dx*(.6+k*.5)+(Math.random()*40-20),dy:dy*(.6+k*.5)+(Math.random()*30-15),s:22+Math.random()*26,t:"🔥",d:.3+Math.random()*.25});}

    for(var j=0;j<4;j++)pt({x:x,y:y,dx:Math.random()*100-50,dy:-(50+Math.random()*90),s:3+Math.random()*4,bg:Math.random()<.5?"#ffb02e":"#ff5a1f",d:.8+Math.random()*.5,css:"box-shadow:0 0 6px #ff8a2a"});
    if(Math.random()<.22)pt({x:x,y:y-10,dx:Math.random()*60-30,dy:-(90+Math.random()*50),s:36,t:"💨",d:1.1});
    if(fTick%3===0){var m=document.createElement("i"),sz=26+Math.random()*28;m.className="burnmark";m.style.cssText="width:"+sz+"px;height:"+sz+"px;left:"+(x-sz/2)+"px;top:"+(y-sz/2)+"px";tgt.appendChild(m);}

    tgt.style.filter="brightness("+(.35+.65*tHp/100)+") sepia("+burn+")";
    tgt.style.boxShadow="inset 0 0 "+(20+40*burn)+"px rgba(255,110,30,"+(.2+.5*burn)+")";
  }
  function nz(c,dur,pw){var n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,pw);var s=c.createBufferSource();s.buffer=b;return s;}
  function nzPlay(c,dur,pw,type,freq,vol,t0,q){var s=nz(c,dur,pw),f=c.createBiquadFilter(),g=c.createGain();f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t0||c.currentTime);}
  function zap(){
    var c=audio();if(!c)return;var t=c.currentTime,i,o=c.createOscillator(),g=c.createGain();
    nzPlay(c,.12,2,"highpass",1800,1,t);
    nzPlay(c,.09,2,"highpass",2500,.7,t+.07);
    for(i=0;i<14;i++)nzPlay(c,.03,1,"bandpass",3000+Math.random()*3000,.35,t+.1+Math.random()*.35,4);
    nzPlay(c,2.2,1.6,"lowpass",220,1.1,t+.1);
    nzPlay(c,1.6,2,"lowpass",90,1.2,t+.08);
    o.type="sine";o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(28,t+.6);
    g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.65);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.7);
  }
  function tink(){var c=audio();if(!c)return;[2400,3100,1800].forEach(function(f,i){var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.03;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.3);});snap();}
  function smash(){
    var c=audio();if(!c)return;var t=c.currentTime,i;
    nzPlay(c,.06,1.5,"lowpass",900,.9,t);
    nzPlay(c,.35,1.2,"highpass",2500,.55,t);
    nzPlay(c,.5,2,"bandpass",5200,.3,t+.02,1.5);
    for(i=0;i<26;i++){
      var o=c.createOscillator(),g=c.createGain(),st=t+.02+Math.pow(Math.random(),1.8)*.7,dur=.05+Math.random()*.18;

      g.gain.setValueAtTime(.12+Math.random()*.1,st);g.gain.exponentialRampToValueAtTime(.001,st+dur);
      o.connect(g);g.connect(c.destination);o.start(st);o.stop(st+dur+.02);
    }
    for(i=0;i<6;i++)nzPlay(c,.04,1,"highpass",3500+Math.random()*3000,.25,t+.15+Math.random()*.5);
  }
  function boltFx(x,y){
    var cw=tgt.clientWidth,ns="http://www.w3.org/2000/svg",sv=document.createElementNS(ns,"svg"),sx=x+(Math.random()*120-60),pts=[[sx,0]],n=8;
    sv.setAttribute("class","bolt");sv.setAttribute("width",cw);sv.setAttribute("height",tgt.clientHeight);

    pts.push([x,y]);
    [[9,"rgba(255,225,77,.55)"],[3,"#fff"]].forEach(function(a){var p=document.createElementNS(ns,"polyline");p.setAttribute("points",pts.map(function(q){return q.join(",");}).join(" "));p.setAttribute("fill","none");p.setAttribute("stroke",a[1]);p.setAttribute("stroke-width",a[0]);p.setAttribute("stroke-linejoin","round");sv.appendChild(p);});
    tgt.appendChild(sv);setTimeout(function(){sv.remove();},280);
    var f=document.createElement("i");f.className="tflash";f.style.setProperty("--fx",x+"px");f.style.setProperty("--fy",y+"px");tgt.appendChild(f);setTimeout(function(){f.remove();},180);
    var m=document.createElement("i"),sz=40+Math.random()*30;m.className="burnmark";m.style.cssText="width:"+sz+"px;height:"+sz+"px;left:"+(x-sz/2)+"px;top:"+(y-sz/2)+"px";tgt.appendChild(m);
    for(var j=0;j<10;j++)pt({x:x,y:y,dx:Math.random()*160-80,dy:Math.random()*160-80,s:3+Math.random()*4,bg:"#ffe14d",d:.5,css:"box-shadow:0 0 6px #ffe14d"});

  function tHit(x,y){
    if(!tOn||!tw||tHp<=0)return;
    tHp=Math.max(0,tHp-(tw==="gun"?4+Math.floor(Math.random()*3):tw==="flame"?1.4:tw==="bolt"?20+Math.floor(Math.random()*8):tw==="ice"?9+Math.floor(Math.random()*4):tw==="dish"?6+Math.floor(Math.random()*4):30+Math.floor(Math.random()*8)));

  /* bubble wrap */
  var grid=document.getElementById("grid"),poppedEl=document.getElementById("popped"),popped=0;

})();
